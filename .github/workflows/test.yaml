name: Unit test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:

  push:
    branches:
    - "main"

  workflow_dispatch:

jobs:
  status:
    name: Initialize and show status
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: "3.14"
    - name: Set up Python environment
      uses: glotzerlab/workflows/setup-uv@2245be9e78600bf7846aaf9555da322446f46110 # 0.11.0
      with:
        lockfile: ".github/workflows/requirements-test.txt"
    - name: Initialize workspace
      run: python3 hoomd_validation/project.py init
    - name: Show workflow
      run: cat --number workflow.toml
    - name: Set up row
      uses: glotzerlab/workflows/setup-row@2245be9e78600bf7846aaf9555da322446f46110 # 0.11.0
    - name: Show project status
      run: row show status

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: All tests
    if: always()
    needs: [status]
    runs-on: ubuntu-24.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: exit 0
