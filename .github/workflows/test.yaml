name: Unit test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:

  push:
    branches:
    - "main"

  workflow_dispatch:

jobs:
  status:
    name: Initialize and show status
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.14"
    - name: Set up Python environment
      uses: glotzerlab/workflows/setup-uv@204dc7c0f82720090703712694b7cab761aacaa0 # 0.13.0
      with:
        lockfile: ".github/workflows/requirements-test.txt"
    - name: Initialize workspace
      run: python3 hoomd_validation/project.py init
    - name: Show workflow
      run: cat --number workflow.toml
    - name: Set up row
      uses: glotzerlab/workflows/setup-row@204dc7c0f82720090703712694b7cab761aacaa0 # 0.13.0
    - name: Show project status
      run: row show status

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: All tests
    if: always()
    needs: [status]
    runs-on: ubuntu-24.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: exit 0
